proxy_cache_path /var/cache/nginx/food-db levels=1:2 keys_zone=food_db_cache:10m max_size=100m inactive=1h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=food_db_requests:10m rate=8r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    # 백엔드 API 프록시 (compose 네트워크의 서비스 이름 사용)
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 공개 식품 데이터 조회만 허용하며 고객 세션은 외부로 전달하지 않습니다.
    location /food-db/api/v3.6/product/ {
        if ($uri !~ "^/food-db/api/v3\.6/product/[0-9]{8,14}\.json$") { return 404; }
        include /etc/nginx/snippets/food-db-proxy.conf;
        proxy_pass https://world.openfoodfacts.org/api/v3.6/product/;
    }

    location /food-db/ {
        return 404;
    }

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
