limit_except GET { deny all; }
limit_req zone=food_db_requests burst=2 nodelay;
limit_req_status 429;

proxy_http_version 1.1;
proxy_set_header Host world.openfoodfacts.org;
proxy_set_header User-Agent "NeuroVector/0.1 (https://github.com/NeruoVector/platform)";
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_pass_request_body off;
proxy_set_header Content-Length "";

proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_connect_timeout 5s;
proxy_send_timeout 20s;
proxy_read_timeout 20s;

proxy_cache food_db_cache;
proxy_cache_key "$proxy_host$uri$is_args$args";
proxy_cache_valid 200 10m;
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header Set-Cookie;
add_header X-Food-DB-Cache $upstream_cache_status always;
